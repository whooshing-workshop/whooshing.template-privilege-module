name: Unit Test
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request: { types: [opened, reopened, synchronize, ready_for_review] }
  push: { branches: [ develop ] }

jobs:
  unit-tests:
    uses: whooshing-workshop/ci/.github/workflows/run-unit-tests.yml@develop
    with:
      ios_scheme_name: whooshing.template-privilege-module
      work_dir: "."

      with_release_mode_testing: true
      with_musl: false
      with_api_check: false
      ios_xcodebuild_action: ''
      
      with_pg_configs: |
        postgres postgres password 5432 file_storage privilege_module

    secrets: inherit
